<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-label="How it works: connects to Encircle, reviews every job daily, flags gaps the same day.">
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-out infinite}
@keyframes p{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.1)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}
</style>
<rect x="20" y="10" width="370" height="220" rx="20" fill="#111A2B" stroke="#1E2A3B"/>
<rect x="48" y="38" width="52" height="52" rx="14" fill="#0F2F2E"/>
<g transform="translate(62 52)"><path d="M5 9h14l-4-4 M19 15H5l4 4" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="t" x="362" y="72" text-anchor="end" font-size="15" font-weight="800" letter-spacing="1.5" fill="#2DD4BF">STEP 01</text>
<text class="t" x="48" y="136" font-size="21" font-weight="800" letter-spacing="-0.3" fill="#E6EDF3">Connects to Encircle</text>
<text class="t" font-size="15" fill="#9AA7B4"><tspan x="48" y="170">Reads jobs from Encircle. Techs keep</tspan><tspan x="48" y="194">documenting the way they do now.</tspan></text>
<path d="M398 120 h48 M438 112 l8 8 -8 8" fill="none" stroke="#2DD4BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="455" y="10" width="370" height="220" rx="20" fill="#111A2B" stroke="#1E2A3B"/>
<rect x="483" y="38" width="52" height="52" rx="14" fill="#0F2F2E"/>
<g transform="translate(497 52)"><path d="M4 7h16v13H4z M4 11h16 M8 4v4 M16 4v4 M9 15.5l2 2 4-4" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="t" x="797" y="72" text-anchor="end" font-size="15" font-weight="800" letter-spacing="1.5" fill="#2DD4BF">STEP 02</text>
<text class="t" x="483" y="136" font-size="21" font-weight="800" letter-spacing="-0.3" fill="#E6EDF3">Reviews every job, daily</text>
<text class="t" font-size="15" fill="#9AA7B4"><tspan x="483" y="170">Checks the photos, readings, and logs</tspan><tspan x="483" y="194">expected for that day of drying.</tspan></text>
<path d="M833 120 h48 M873 112 l8 8 -8 8" fill="none" stroke="#2DD4BF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="890" y="10" width="370" height="220" rx="20" fill="#111A2B" stroke="#1E2A3B"/>
<rect x="918" y="38" width="52" height="52" rx="14" fill="#0F2F2E"/>
<g transform="translate(932 52)"><path d="M6 21V4 M6 4h11l-2.5 4.5L17 13H6" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="t" x="1232" y="72" text-anchor="end" font-size="15" font-weight="800" letter-spacing="1.5" fill="#2DD4BF">STEP 03</text>
<text class="t" x="918" y="136" font-size="21" font-weight="800" letter-spacing="-0.3" fill="#E6EDF3">Flags gaps the same day</text>
<text class="t" font-size="15" fill="#9AA7B4"><tspan x="918" y="170">Missing items go to the crew while</tspan><tspan x="918" y="194">they can still go back.</tspan></text>
</svg>